version: '3.8'

services:
  # -------------------------------------------------------------
  # PostgreSQL Database Service (Exact 3-Table Schema)
  # -------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: evonence_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-employeeskilllmatrix}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-employeeskilllmatrix}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Python FastAPI Backend Service
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: evonence_backend
    restart: always
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-employeeskilllmatrix}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-employeeskilllmatrix}
      SECRET_KEY: ${SECRET_KEY:-evonence-super-secure-jwt-secret-key-2026}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # -------------------------------------------------------------
  # Frontend Application Service
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evonence_frontend
    restart: always
    environment:
      PORT: 3000
      BACKEND_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
